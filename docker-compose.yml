version: '3.8'

services:
  ecom-task-force:
    build: .
    ports:
      - "3000:3000"  # Web interface
      - "4000:4000"  # API
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/atlas.db
      - PORT=4000
      - WEB_PORT=3000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - ecom-network

  # Proxy service for IP rotation
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - ecom-task-force
    restart: unless-stopped
    networks:
      - ecom-network

  # IP rotation service
  ip-rotator:
    build: ./ip-rotator
    environment:
      - PROXY_POOL_SIZE=10
      - ROTATION_INTERVAL=300  # 5 minutes
    volumes:
      - ./proxy-list.txt:/app/proxy-list.txt
    restart: unless-stopped
    networks:
      - ecom-network

networks:
  ecom-network:
    driver: bridge
